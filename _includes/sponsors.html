{% if site.sponsors %}

	<div class="sponsors">
		<p>Disponible también en...</p>
		<div>

			{% for sponsor in site.sponsors %}

				<a href="{{ sponsor.url }}" target="_blank" rel="noopener noreferrer">
					<img src="{{ sponsor.image | relative_url }}" alt="{{ sponsor.title }}" loading="lazy" draggable="false">
				</a>

			{% endfor %}

		</div>
	</div>

{% endif %}
