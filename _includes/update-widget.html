<div id="mcnUpdateWidget" class="update-widget" hidden>
    <span class="update-widget-dot" aria-hidden="true"></span>
    <span id="mcnUpdateWidgetText" class="update-widget-text"></span>
</div>
<script>
(function () {
    var BUILD_TIME_KEY = "mcn_last_seen_build_time";
    var COMMIT_ETAG_KEY = "mcn_commits_etag";
    var COMMIT_DATE_KEY = "mcn_commits_date";
    var widget = document.getElementById("mcnUpdateWidget");
    var textEl = document.getElementById("mcnUpdateWidgetText");
    if (!widget || !textEl) return;

    var meta = document.querySelector('meta[name="build-time"]');
    var buildTime = meta ? (meta.getAttribute("content") || "") : "";
    var buildDate = buildTime ? new Date(buildTime) : null;
    var lastCheck = 0;
    var repo = null;

    function repoFromHost() {
        var host = location.hostname.replace(/^www\./i, "");
        var m = /^([\w-]+)\.github\.io$/i.exec(host);
        return m ? m[1] + "/" + m[0] : null;
    }

    function pad(n) { return (n < 10 ? "0" : "") + n; }

    function fmtDate(d) {
        return pad(d.getDate()) + "/" + pad(d.getMonth() + 1) + "/" + d.getFullYear() + " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
    }

    function load(key) {
        try { return localStorage.getItem(key); } catch (e) { return null; }
    }

    function store(key, value) {
        try { localStorage.setItem(key, value); } catch (e) {}
    }

    function setState(state, text) {
        widget.className = "update-widget" + (state ? " " + state : "");
        textEl.textContent = text;
        if (buildDate && !isNaN(buildDate.getTime())) {
            widget.title = "Publicado el " + buildDate.toString();
        }
    }

    function show() {
        var stored = load(BUILD_TIME_KEY);
        if (buildDate && stored && stored !== buildTime) {
            setState("new", "Sitio actualizado: " + fmtDate(buildDate));
        } else {
            setState("ok", buildDate ? "Actualizado: " + fmtDate(buildDate) : "");
        }
        if (buildTime) store(BUILD_TIME_KEY, buildTime);
        widget.hidden = false;
    }

    function latestCommitDate(data) {
        if (data && Object.prototype.toString.call(data) === "[object Array]" && data[0]) data = data[0];
        var c = data && data.commit;
        var s = c && ((c.committer && c.committer.date) || (c.author && c.author.date)) || "";
        var d = s ? new Date(s) : null;
        return d && !isNaN(d.getTime()) ? d : null;
    }

    function refreshDeployedBuild() {
        return fetch(location.href, { cache: "no-store", headers: { "Accept": "text/html" } })
            .then(function (r) { return r.ok ? r.text() : Promise.reject(r.status); })
            .then(function (html) {
                var m = html.match(/<meta name="build-time" content="([^"]*)"/i);
                if (!m) return false;
                var t = new Date(m[1]);
                if (isNaN(t.getTime())) return false;
                if (t.getTime() > buildDate.getTime()) {
                    buildTime = m[1];
                    buildDate = t;
                    store(BUILD_TIME_KEY, buildTime);
                    setState("new", "Sitio actualizado: " + fmtDate(buildDate));
                    return true;
                }
                return false;
            })
            .catch(function () { return false; });
    }

    function checkRemote() {
        if (!repo || !buildDate) return;
        var now = Date.now();
        if (now - lastCheck < 30000) return;
        lastCheck = now;

        var headers = { "Accept": "application/vnd.github+json" };
        var etag = load(COMMIT_ETAG_KEY);
        if (etag) headers["If-None-Match"] = etag;

        fetch("https://api.github.com/repos/" + repo + "/commits?per_page=1", { headers: headers })
            .then(function (r) {
                if (r.status === 304) return null;
                if (!r.ok) return Promise.reject(r.status);
                var newEtag = r.headers.get("ETag");
                if (newEtag) store(COMMIT_ETAG_KEY, newEtag);
                return r.json();
            })
            .then(function (data) {
                if (!data) return null;
                var d = latestCommitDate(data);
                if (d) store(COMMIT_DATE_KEY, d.toISOString());
                return d;
            })
            .then(function (commitDate) {
                if (!commitDate) return;
                refreshDeployedBuild().then(function (siteUpdated) {
                    if (siteUpdated) return;
                    if (commitDate.getTime() > buildDate.getTime()) {
                        setState("busy", "Nueva versión en proceso de publicación…");
                    } else if (!widget.classList.contains("new")) {
                        setState("ok", "Actualizado: " + fmtDate(buildDate));
                    }
                });
            })
            .catch(function () {});
    }

    repo = repoFromHost();
    if (!buildDate && !repo) return;
    show();
    checkRemote();
    setInterval(checkRemote, 60000);
    document.addEventListener("visibilitychange", function () {
        if (!document.hidden) checkRemote();
    });
})();
</script>
